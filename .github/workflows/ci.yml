name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check
      run: npm run type-check
    
    - name: Run linter
      run: npm run lint
    
    - name: Build project
      run: npm run build
    
    - name: Run tests
      run: npm run test:coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.node-version == '18.x'
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # npm audit is broken against the public npm registry: the advisories/bulk
    # endpoint returns a gzip body without a Content-Encoding header, so npm
    # fails to parse it on every npm version. Use OSV-Scanner instead, which
    # reads the committed lockfile against the independent OSV.dev database and
    # blocks the job on discovered vulnerabilities.
    - name: Run OSV vulnerability scan
      uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
      with:
        scan-args: |-
          --lockfile=package-lock.json