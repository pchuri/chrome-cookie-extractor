name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check
      run: npm run type-check
    
    - name: Run linter
      run: npm run lint
    
    - name: Build project
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    # npm audit is broken against the public npm registry: the advisories/bulk
    # endpoint returns a gzip body without a Content-Encoding header, so npm
    # fails to parse it on every npm version. Use OSV-Scanner instead, which
    # reads the committed lockfile against the independent OSV.dev database and
    # blocks the job on discovered vulnerabilities.
    - name: Run OSV vulnerability scan
      uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
      with:
        scan-args: |-
          --lockfile=package-lock.json
    
    - name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        HUSKY: 0
      run: npx semantic-release