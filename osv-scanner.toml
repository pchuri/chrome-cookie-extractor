# OSV-Scanner ignore config for the `security` CI gate.
#
# SCOPE: This file ignores ONLY the specific advisory IDs listed below. It does
# NOT blanket-ignore dev dependencies, ecosystems, or severities. Any NEW or
# different advisory (runtime or dev, of any severity) will still fail the gate.
#
# WHY THESE ARE IGNORED (maintainer decision, 2026-07-26):
# All six affected packages are reached SOLELY through the release-time
# devDependency `@semantic-release/npm -> npm`, inside npm's frozen
# `bundledDependencies`. Bundled deps are pinned at npm's own publish time and
# CANNOT be remediated from this repo via `npm update` or `overrides`. They are
# release-only: not present in the shipped runtime, nor exercised by the build
# or test suite. Forcing a newer `npm` bundle was tested and rejected (it still
# trails these advisories and requires Node >=22, breaking the 16/18/20 matrix).
# All non-bundled production and dev advisories ARE fixed via bumps/overrides.

